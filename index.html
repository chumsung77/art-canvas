<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Art Canvas & Masterpiece Gallery</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #art-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        #art-image.loaded {
            opacity: 1;
        }
        #caption {
            position: absolute;
            bottom: 30px;
            left: 40px;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px 25px;
            border-radius: 8px;
            max-width: 600px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            backdrop-filter: blur(5px);
            border-left: 4px solid #d4af37;
        }
        #caption.loaded {
            opacity: 1;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .artist {
            font-size: 15px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="container">
        <img id="art-image" alt="Masterpiece">
        <div id="caption">
            <div class="title" id="art-title">Loading Masterpiece...</div>
            <div class="artist" id="art-artist">Connecting to Museum API</div>
        </div>
    </div>

    <script>
        // 거장들의 검색 키워드 풀
        const queries = ['van-gogh', 'monet', 'rembrandt', 'vermeer', 'degas', 'cezanne', 'renoir'];
        
        async function fetchRandomArt() {
            try {
                // 1. 무작위 화가/키워드 선택
                const query = queries[Math.floor(Math.random() * queries.length)];
                const searchRes = await fetch(`https://collectionapi.metmuseum.org/public/collection/v1/search?hasImages=true&q=${query}`);
                const searchData = await searchRes.json();
                
                if (!searchData.objectIDs || searchData.objectIDs.length === 0) {
                    setTimeout(fetchRandomArt, 3000);
                    return;
                }

                // 2. 검색된 작품 ID 중 랜덤 선택
                const ids = searchData.objectIDs;
                const randomId = ids[Math.floor(Math.random() * Math.min(ids.length, 100))];

                // 3. 작품 상세 데이터 호출
                const objRes = await fetch(`https://collectionapi.metmuseum.org/public/collection/v1/objects/${randomId}`);
                const objData = await objRes.json();

                const imageUrl = objData.primaryImage || objData.primaryImageSmall;
                const title = objData.title || "Untitled";
                const artist = objData.artistDisplayName || "Unknown Artist";
                const date = objData.objectDate ? ` (${objData.objectDate})` : "";

                if (imageUrl) {
                    displayArt(imageUrl, title, artist + date);
                } else {
                    fetchRandomArt(); // 이미지 정보가 누락된 경우 다음 작품 시도
                }
            } catch (error) {
                console.error("Error fetching art:", error);
                setTimeout(fetchRandomArt, 5000);
            }
        }

        function displayArt(url, title, artist) {
            const img = document.getElementById('art-image');
            const caption = document.getElementById('caption');
            const titleEl = document.getElementById('art-title');
            const artistEl = document.getElementById('art-artist');

            // 페이드 아웃
            img.classList.remove('loaded');
            caption.classList.remove('loaded');

            const newImg = new Image();
            newImg.src = url;
            newImg.onload = () => {
                img.src = url;
                titleEl.innerText = title;
                artistEl.innerText = artist;

                // 페이드 인
                img.classList.add('loaded');
                caption.classList.add('loaded');
            };
        }

        // 최초 실행
        fetchRandomArt();

        // 10분마다 자동 갱신 (10 * 60 * 1000 밀리초)
        setInterval(fetchRandomArt, 10 * 60 * 1000);

        // 화면 클릭 또는 리모컨 OK 버튼 입력 시 즉시 다음 명화로 전환
        document.body.addEventListener('click', () => {
            fetchRandomArt();
        });
    </script>
</body>
</html>
